name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Test, build the library and the showcase app
        run: ./gradlew :meniscus:testDebugUnitTest :meniscus:assembleRelease :sample:assembleDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: meniscus/build/test-results/
